<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroLife | Reset Password</title>
    <meta name="description" content="Reset your AstroLife astronaut access credentials.">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <!-- MINIMAL TOP HEADER -->
    <header class="auth-header">
        <a href="index.html" class="logo" aria-label="AstroLife Home">
            <span class="logo-icon">✦</span>
            ASTROLIFE
        </a>
        <a href="index.html" class="back-home-link">
            ← Back to Mission Site
        </a>
    </header>

    <!-- MAIN AUTH CONTAINER -->
    <main class="auth-main">
        <div class="auth-card">

            <div class="auth-title-section">
                <span class="auth-badge">
                    <span class="auth-badge-dot"></span>
                    CREDENTIAL RECOVERY
                </span>
                <h1>Reset Password</h1>
                <p>Enter your registered mission email to receive access recovery instructions.</p>
            </div>

            <!-- DYNAMIC STATUS ALERT -->
            <div id="authAlert" class="auth-alert" role="alert"></div>

            <form id="forgotForm" novalidate>

                <!-- EMAIL FIELD -->
                <div class="form-group">
                    <label for="forgotEmail" class="form-label">Mission Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉</span>
                        <input type="email" id="forgotEmail" class="form-input" placeholder="astronaut@astrolife.space" autocomplete="email" required>
                    </div>
                    <div id="forgotEmailError" class="form-error"></div>
                </div>

                <!-- SUBMIT BUTTON -->
                <button type="submit" id="forgotSubmitBtn" class="btn-primary" style="margin-top: 10px;">
                    Send Reset Instructions <span>→</span>
                </button>

            </form>

            <!-- SWITCH TO LOGIN -->
            <div class="auth-footer-link">
                Remember your credentials?
                <a href="login.html">Back to Login</a>
            </div>

        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
